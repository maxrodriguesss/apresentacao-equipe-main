<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa Equipe</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="font-sans leading-normal tracking-normal overflow-x-hidden min-h-screen relative z-0">

    <canvas id="neve" aria-hidden="true"></canvas>

    <div id="logo-topo" style="position: fixed; top: 50px; left: 50px; z-index: 50;">
        <img src="assets/img/logo.png" alt="Logo Suporte CCL" style="height: 130px; width: auto;">
    </div>

    <div id="mascote" style="position: fixed; bottom: 0; right: 50px; z-index: 50;">
        <img src="assets/img/construlino.png" alt="Mascote" style="height: 380px; width: auto; display: block;">
    </div>

    <section id="team" class="min-h-screen flex items-center justify-center overflow-hidden w-full relative z-20"
             data-aos="fade-up" data-aos-duration="1000">

        <div class="container mx-auto px-6">
            <h3 id="titulo" class="text-9xl md:text-4xl font-bold text-center mb-20 animate-fade-in text-white">SUPORTE CCL</h3>

            <div class="relative w-full max-w-4xl mx-auto group">
                <img id="papai-noel" src="assets/videos/renas.gif" alt="" aria-hidden="true">
                <div id="carousel" class="flex transition-transform duration-500 ease-in-out"></div>


                <div id="carousel-indicators" class="flex justify-center mt-8 space-x-2"></div>
            </div>
        </div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, mirror: false, duration: 300000, easing: 'ease-out-cubic' });
    </script>
    <script src="js/script.js"></script>
    <script src="js/neve.js"></script>

</body>
</html>
